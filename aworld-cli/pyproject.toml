[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "aworld-cli"
version = "1.0.0a9"
description = "Thin command-line wrapper for AWorld"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["aworld==1.0.0a9"]

[project.optional-dependencies]
llm = ["aworld[llm]==1.0.0a9"]
skills = ["aworld[skills]==1.0.0a9"]

[project.scripts]
aworld-cli = "aworld_cli.entrypoint:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/aworld_cli/__init__.py", "src/aworld_cli/__main__.py", "src/aworld_cli/entrypoint.py"]
sources = ["src"]
