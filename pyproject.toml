[tool.hatch.build.targets.sdist]
include = ["/aworld", "/aworld-cli", "/examples/core_session", "/tests", "/conftest.py", "/pytest.ini", "/pytest.legacy.ini", "/setup.py", "/scripts/build_packages.py", "/pyproject.toml", "/README.md", "/README_zh.md", "/LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"aworld/logs/__init__.py" = "aworld/logs/__init__.py"
"aworld/logs/instrument/__init__.py" = "aworld/logs/instrument/__init__.py"
"aworld/logs/instrument/loguru_instrument.py" = "aworld/logs/instrument/loguru_instrument.py"
"aworld/logs/log_provider.py" = "aworld/logs/log_provider.py"
