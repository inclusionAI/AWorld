[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "aworld"
dynamic = ["version"]
description = "AWorld: a minimal Session/Run agent kernel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ant AI"}]
dependencies = []

[project.scripts]
aworld = "aworld.cli.main:main"

[project.optional-dependencies]
llm = [
    "openai>=1.66.3,<3", "httpx[socks]>=0.27,<1", "pydantic>=2.9.2,<3",
    "PyYAML>=6,<7", "loguru>=0.7.3,<1", "numpy>=1.26,<3",
    "tiktoken>=0.9,<1", "requests>=2.32,<3", "wrapt>=1.16,<3",
    "executing>=2.2,<3", "packaging>=24", "fastapi>=0.115,<1",
    "importlib-metadata>=8,<9", "opentelemetry-api>=1.32,<2",
    "opentelemetry-sdk>=1.32,<2",
]
skills = ["PyYAML>=6,<7"]
dev = ["pytest>=8", "build>=1.2,<2", "hatchling>=1.27,<2", "editables>=0.5,<1"]

[tool.hatch.version]
path = "aworld/_version.py"

[tool.hatch.build.targets.wheel]
ignore-vcs = true
