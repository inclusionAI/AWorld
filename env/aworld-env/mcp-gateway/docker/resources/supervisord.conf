[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
loglevel=info

[program:mcp_session_cleaner]
command=uv run --no-sync -m mcp_gateway.cli.session_cleaner
directory=/app/mcp_gateway/
autorestart=true
priority=1
startsecs=3
startretries=3
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp_gateway]
command=uv run --no-sync -m mcp_gateway.main
directory=/app/mcp_gateway/
autorestart=true
priority=1
startsecs=3
startretries=3
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

