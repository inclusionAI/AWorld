[project]
name = "mcp-server-proxy"
version = "0.1.0"
description = "MCP Server Proxy"
requires-python = ">=3.12"
dependencies = [
    "docker",
    "aiohttp",
    "playwright==1.52",
    "pydantic",
    "pydantic-settings",
    "fastapi[standard]",
    "typer",
    "aiofiles",
    "python-dotenv",
    "websockets",
    "pyyaml",
    "mcp==1.12.4",
    "httpx[http2]",
    "requests>=2.32.5",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
]
dev = [
    "pip",
    "black>=21.0",
    "flake8>=3.9.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"