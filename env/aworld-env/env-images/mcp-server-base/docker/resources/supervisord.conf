[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
loglevel=info

# [include]
# files = /etc/supervisor/conf.d/*.conf

[program:xvfb]
command=Xvfb :0 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx24 -dpi %(ENV_SCREEN_DPI)s +extension RANDR -ac -nolisten tcp
autorestart=true
priority=1
startsecs=1
startretries=5
stdout_logfile=/var/log/xvfb.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11setup]
command=/app/view_server/x11-setup.sh
environment=DISPLAY=:0
autorestart=false
startretries=0
priority=2
stdout_logfile=/var/log/x11-setup.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tint2]
command=tint2 -c /root/.config/tint2/tint2rc
environment=DISPLAY=:0
autorestart=true
priority=3
startsecs=1
startretries=5
stdout_logfile=/var/log/tint2.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=openbox-session
environment=DISPLAY=:0
autorestart=true
priority=3
startsecs=1
startretries=5
stdout_logfile=/var/log/openbox.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=x11vnc -display :0 -forever -shared -nopw -geometry %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)s -nomodtweak -repeat -tightfilexfer -defer 5 -wait 10 -nowf -threads -cursor most
autorestart=true
priority=4
startsecs=1
startretries=5
depends_on=xvfb,x11setup
stdout_logfile=/var/log/x11vnc.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/local/novnc/utils/novnc_proxy --vnc localhost:5900 --listen %(ENV_NO_VNC_PORT)s --heartbeat 10
autorestart=true
priority=5
startsecs=1
startretries=5
depends_on=x11vnc
stdout_logfile=/var/log/novnc.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mcp_server_proxy]
command=uv run --no-sync -m mcp_server_proxy.main
directory=/app/mcp_server_proxy/
autorestart=true
priority=1
startsecs=3
startretries=3
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

