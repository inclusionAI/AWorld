[pytest]
testpaths = tests/core/session tests/packaging tests/test_chat_completions.py
addopts = --strict-markers --tb=short
asyncio_mode = auto
markers =
    integration: integration tests that exercise multiple runtime components
    replay_sandbox: tests that require the native replay sandbox host
    requires_llm: tests that require a configured live language model
    semantic_model_live: live semantic-model qualification tests
