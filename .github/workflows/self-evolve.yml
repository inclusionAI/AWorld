name: Self-evolve tests

on:
  push:
    branches:
      - main
      - release-[0-9]+.[0-9]+
    paths:
      - ".github/workflows/self-evolve.yml"
      - "aworld/self_evolve/**"
      - "aworld/agents/llm_agent.py"
      - "aworld/config/conf.py"
      - "aworld/core/context/base.py"
      - "aworld/core/llm_provider.py"
      - "aworld/evaluations/**"
      - "aworld/models/**"
      - "aworld/utils/serialized_util.py"
      - "aworld-cli/src/aworld_cli/**"
      - "aworld-skills/self_evolve/**"
      - "tests/core/test_evaluator_runtime.py"
      - "tests/core/test_optimize_top_level_command.py"
      - "tests/evaluations/**"
      - "tests/executors/**"
      - "tests/models/**"
      - "tests/plugins/**"
      - "tests/self_evolve/**"
      - "tests/test_slash_commands.py"
      - "pytest.ini"
  pull_request:
    branches:
      - main
      - release-[0-9]+.[0-9]+
    paths:
      - ".github/workflows/self-evolve.yml"
      - "aworld/self_evolve/**"
      - "aworld/agents/llm_agent.py"
      - "aworld/config/conf.py"
      - "aworld/core/context/base.py"
      - "aworld/core/llm_provider.py"
      - "aworld/evaluations/**"
      - "aworld/models/**"
      - "aworld/utils/serialized_util.py"
      - "aworld-cli/src/aworld_cli/**"
      - "aworld-skills/self_evolve/**"
      - "tests/core/test_evaluator_runtime.py"
      - "tests/core/test_optimize_top_level_command.py"
      - "tests/evaluations/**"
      - "tests/executors/**"
      - "tests/models/**"
      - "tests/plugins/**"
      - "tests/self_evolve/**"
      - "tests/test_slash_commands.py"
      - "pytest.ini"

permissions:
  contents: read

jobs:
  self-evolve:
    name: Self-evolve (${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: platform-neutral
            pytest_args: 'tests/self_evolve -m "not replay_sandbox" -q'
          - os: macos-latest
            suite: native-replay-sandbox
            pytest_args: 'tests/self_evolve -m replay_sandbox -q'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          python -m pip install flake8 pytest pytest-asyncio python-dotenv
          python setup.py install
      - name: Run self-evolve tests
        run: python -m pytest ${{ matrix.pytest_args }}
      - name: Run cross-module self-evolve contracts
        if: runner.os == 'Linux'
        run: |
          python -m pytest -q \
            tests/core/test_optimize_top_level_command.py \
            tests/core/test_skill_cli.py \
            tests/core/tool/test_replay_policy_profile.py \
            tests/core/tool/test_runtime_tool_call_budget.py \
            tests/evaluations/test_evaluation_input_sources.py \
            tests/evaluations/test_evaluation_substrate.py \
            tests/executors/test_continuous.py \
            tests/executors/test_local_active_steering.py \
            tests/models/test_llm_call_capture.py \
            tests/models/test_model_response_llm_calls.py \
            tests/plugins/test_runtime_hud_snapshot.py \
            tests/runners/test_deterministic_task_batch.py \
            tests/test_slash_commands.py
      - name: Run framework contract matrix on native sandbox host
        if: runner.os == 'macOS'
        run: python -m pytest tests/self_evolve/test_framework_contract_matrix.py -q
